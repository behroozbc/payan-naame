name: Compile LaTeX Thesis

on:
  push:
    branches: [  master ]
    paths:
      - '**.tex'
      - '**.bib'
      - '**.cls'
      - '**.sty'
  pull_request:
    branches: [  master ]
  workflow_dispatch:  # دکمه Manual Run

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: ketabche
          # نام فایل اصلی پایان‌نامه‌ات (معمولاً main.tex یا thesis.tex)
          root_file: main.tex
          
          # اگر از XeLaTeX یا LuaLaTeX استفاده می‌کنی:
          # latexmk: true
          # args: -xelatex -file-line-error -interaction=nonstopmode
          
      - name: List generated files (برای دیباگ)
        run: ls -la ketabche/
        working-directory: .

      - name: Check if PDF exists
        run: |
          ls -la ketabche/
          if [ -f ketabche/main.pdf ]; then
            echo "✅ PDF successfully generated"
          else
            echo "❌ PDF not found!"
          fi

      - name: Upload PDF as Artifact
        uses: actions/upload-artifact@v4
        with:
          with:
          name: thesis-pdf
          path: ketabche/main.pdf        # ← اینجا حتماً از / استفاده کن
          retention-days: 60